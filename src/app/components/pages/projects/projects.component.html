<div class="basic-page">
  <div class="max-width-1200 auto-margin">
    <h1>Projekti</h1>
    <div>
      <mat-spinner
        class="auto-margin"
        *ngIf="projects.length == 0"
      ></mat-spinner>
      <div *ngIf="projects.length != 0" class="projects">
        <div class="project" *ngFor="let project of projects">
          <project-card [project]="project"></project-card>
        </div>
      </div>
    </div>
  </div>
</div>
