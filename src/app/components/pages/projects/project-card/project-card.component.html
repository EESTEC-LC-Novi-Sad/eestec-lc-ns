<a [routerLink]="getProjectRoute()">
  <div class="card-container clickable">

    <div class="fill stretch-width stretch-height">
      <img
        [src]="project.coverImage"
        [alt]="project.title"
      />
    </div>

    <div class="gradient stretch-width stretch-height"></div>

    <div class="title">
      <h1>{{ project.title }}</h1>
    </div>

  </div>
</a>
